[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-deepfake"
version = "0.1.0"
description = "Audio deepfake detection and robustness experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "soundfile>=0.13,<0.14",
    "scikit-learn>=1.4,<2",
    "threadpoolctl>=3.5,<4",
]

[project.scripts]
audio-deepfake = "audio_deepfake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
