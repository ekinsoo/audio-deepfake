# Experiment plan only. A training command is not implemented yet.
[experiment]
name = "la2019-lfcc-gmm-pilot"
seed = 42
stage = "pilot"

[data]
dataset = "ASVspoof2019-LA"
version = "Zenodo-6906306-v1"
sample_rate = 16000
train_limit = 2000
dev_limit = 1000
eval_enabled = false
sampling_policy = "balanced-labels-proportional-spoof-attacks-sha256"

[model]
family = "lfcc-gmm"
n_components = 32
covariance_type = "diag"
max_total_training_frames = 100000

[features]
sample_rate = 16000
window_ms = 20.0
hop_ms = 10.0
n_fft = 512
n_filters = 20
n_coeffs = 20
pre_emphasis = 0.97
delta_order = 2

[resources]
workers = 2
target_peak_ram_gib = 2

[paths]
# Ignored local storage; no audio has been downloaded yet.
audio_root = "data/asvspoof2019/LA"
manifest_dir = "outputs/manifests/asvspoof2019-la-seed42"
